# The source of mgtt-export-verdicts.json: minishop with one store that
# tolerates a saturated pool (healthy_in) and one that must keep headroom
# (its own broken state). Regenerate from an mgtt checkout with
#
#   MGTT_HOME=examples/minishop/mgtt-home \
#     mgtt model export --json mgtt-export-verdicts.yaml > mgtt-export-verdicts.json
meta:
  name: minishop-verdicts
  version: "1.0"
  providers:
    - mgt-tool/minishop@^0.1.0
  scenarios: none

components:
  store-a:
    type: datastore
    healthy_in: [saturated]          # a busy pool is fine for this one
  store-b:
    type: datastore
    states:
      low_pool:                      # this one must keep headroom
        when: "available == true & connection_count >= 400"
        can_cause: [connection_refused]
  api:
    type: service
    depends:
      - on: store-a
      - on: store-b
